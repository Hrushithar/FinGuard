<svg width="1400" height="860" viewBox="0 0 1400 860" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#edf3f5"/>
      <stop offset="100%" stop-color="#f6efff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#0a3f58"/>
      <stop offset="100%" stop-color="#14355f"/>
    </linearGradient>
    <linearGradient id="panelSoft" x1="0" x2="1">
      <stop offset="0%" stop-color="#98d6f4"/>
      <stop offset="100%" stop-color="#6dc7d8"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" x2="1">
      <stop offset="0%" stop-color="#4ad2a9"/>
      <stop offset="100%" stop-color="#75f0d9"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb36b"/>
      <stop offset="100%" stop-color="#ff7d5d"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" x2="1">
      <stop offset="0%" stop-color="#f263d2"/>
      <stop offset="100%" stop-color="#a856ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0e2850" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#67f2e7"/>
    </marker>
    <marker id="arrowAlt" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ff6dcf"/>
    </marker>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>

  <text x="700" y="70" text-anchor="middle" font-size="52" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1a2a42">FinGuard — Real-Time Credit Card Fraud Detection Platform</text>

  <!-- Left panel: Sources -->
  <g filter="url(#shadow)">
    <rect x="60" y="140" width="180" height="260" rx="20" fill="#d8ebf7" stroke="#8ad3f5" stroke-width="2"/>
    <rect x="60" y="140" width="180" height="78" rx="20" fill="#bfeaf4"/>
    <text x="150" y="188" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1f2f43">Streaming</text>
    <text x="150" y="216" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1f2f43">Sources</text>

    <rect x="90" y="260" width="120" height="96" rx="18" fill="#88d7d5"/>
    <text x="150" y="298" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d3557">Kafka</text>

    <rect x="90" y="372" width="120" height="96" rx="18" fill="#d4f5f8"/>
    <text x="150" y="408" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d3557">Streaming</text>
    <text x="150" y="435" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d3557">JSON /</text>
    <text x="150" y="458" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d3557">Transaction</text>
    <text x="150" y="481" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d3557">Events</text>
  </g>

  <!-- Left lower panel -->
  <g filter="url(#shadow)">
    <rect x="60" y="465" width="180" height="260" rx="20" fill="#d8ebf7" stroke="#8ad3f5" stroke-width="2"/>
    <rect x="60" y="465" width="180" height="78" rx="20" fill="#bfeaf4"/>
    <text x="150" y="513" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1f2f43">Batch</text>
    <text x="150" y="541" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1f2f43">Sources</text>

    <rect x="90" y="585" width="120" height="96" rx="18" fill="#f9d5ef"/>
    <text x="150" y="634" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#5d2567">PostgreSQL</text>
  </g>

  <!-- Mid processing panel -->
  <g filter="url(#shadow)">
    <rect x="300" y="120" width="760" height="590" rx="28" fill="url(#panel)"/>
    <text x="680" y="190" text-anchor="middle" font-size="40" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#edf9ff">Data Processing</text>

    <rect x="385" y="228" width="250" height="130" rx="18" fill="#4ec6c7"/>
    <text x="510" y="270" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Spark</text>
    <text x="510" y="302" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Structured</text>
    <text x="510" y="334" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Streaming</text>

    <rect x="665" y="228" width="180" height="130" rx="18" fill="#8be6d4"/>
    <text x="755" y="280" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16345e">Auto</text>
    <text x="755" y="314" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#16345e">Loader</text>

    <!-- Lakeflow -->
    <rect x="445" y="415" width="430" height="134" rx="18" fill="#7ed5eb"/>
    <text x="660" y="460" text-anchor="middle" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1a2d4c">Databricks Lakeflow</text>
    <text x="660" y="495" text-anchor="middle" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1a2d4c">Declarative Pipelines</text>

    <!-- Medallion architecture -->
    <g>
      <text x="660" y="585" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#dfefff">Medallion Architecture</text>
      <rect x="405" y="620" width="180" height="52" rx="10" fill="url(#orange)"/> 
      <rect x="610" y="620" width="180" height="52" rx="10" fill="#dfeffb"/>
      <rect x="815" y="620" width="170" height="52" rx="10" fill="#9fe8ff"/>
      <text x="495" y="654" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#fff">Bronze</text>
      <text x="700" y="654" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1b2f4d">Silver</text>
      <text x="900" y="654" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1b2f4d">Delta Lake</text>
    </g>
  </g>

  <!-- Data flow arrows -->
  <line x1="240" y1="302" x2="325" y2="302" stroke="#67f2e7" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="240" y1="600" x2="325" y2="600" stroke="#67f2e7" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="662" y1="358" x2="665" y2="405" stroke="#67f2e7" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="905" y1="358" x2="905" y2="405" stroke="#67f2e7" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M 920 420 C 1040 370, 1085 350, 1110 330" stroke="#67f2e7" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 920 565 C 1040 620, 1090 640, 1110 655" stroke="#7ad6ff" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <!-- right panel -->
  <g filter="url(#shadow)">
    <rect x="1115" y="140" width="220" height="260" rx="20" fill="#f7e5eb" stroke="#ff8eab" stroke-width="2"/>
    <rect x="1115" y="140" width="220" height="70" rx="20" fill="#f3cfd6"/>
    <text x="1225" y="185" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2d2d3a">Consumption</text>

    <rect x="1165" y="228" width="120" height="100" rx="18" fill="#fb6b6b"/>
    <text x="1225" y="278" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#fff">Alerts</text>
    <circle cx="1268" cy="248" r="12" fill="#f4d35e"/>
    <text x="1268" y="253" text-anchor="middle" font-size="16" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#3d2a00">1</text>

    <rect x="1160" y="350" width="130" height="96" rx="18" fill="#f7d6eb"/>
    <text x="1225" y="400" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2c2c50">Dashboard</text>
  </g>

  <!-- Lower middle / orchestration -->
  <g filter="url(#shadow)">
    <rect x="324" y="710" width="420" height="120" rx="20" fill="#b8f4d9"/>
    <text x="534" y="755" text-anchor="middle" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1a2a42">Orchestration</text>
    <text x="534" y="790" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1a2a42">Databricks Lakeflow Jobs</text>
  </g>

  <!-- Governance -->
  <g filter="url(#shadow)">
    <rect x="820" y="710" width="300" height="120" rx="20" fill="#f5d0f5"/>
    <text x="970" y="755" text-anchor="middle" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2a1d34">Governance</text>
    <text x="970" y="790" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2a1d34">Unity Catalog</text>
  </g>

  <!-- Extra labels -->
  <g>
    <text x="145" y="610" text-anchor="middle" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#163864">PostgreSQL</text>
  </g>
</svg>
